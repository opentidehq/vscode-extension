# Dependabot version updates. Every PR runs CI; merge green ones after reading the release notes.
#
# Not covered: the vsce and ovsx versions in publish.yml (VSCE_VERSION, OVSX_VERSION) and the Alpine
# smoke-test image digest in scripts/release-lib.mjs (ALPINE_IMAGE). Bump those by hand, checking
# `npx @vscode/vsce@<v> publish --help` still lists --oidc and `npx ovsx@<v> publish --help`
# --trusted-publishing. The bundled opentide (pins.json) is a release decision: docs/RELEASING.md.
version: 2
updates:
  # Dependencies and the dev toolchain in package.json / package-lock.json (exact pins).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # The test and lint toolchain moves together and never changes shipped behaviour.
      dev-toolchain:
        dependency-type: "development"
        patterns: ["@types/*", "@vscode/test-*", "mocha", "@biomejs/biome"]
    ignore:
      # @types/vscode is the engines.vscode floor (docs/ARCHITECTURE.md); raise both together, by hand.
      - dependency-name: "@types/vscode"

  # Actions in .github/workflows are pinned by commit SHA with a version comment; Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
