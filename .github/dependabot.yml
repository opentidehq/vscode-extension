# Dependabot version updates. Every PR runs CI; merge green ones after reading the release notes.
#
# Not covered: pins.json (the opentide CI tests against, the engine and grammars): docs/PACKAGING.md.
version: 2
updates:
  # Dependencies and the dev toolchain in package.json / package-lock.json (exact pins).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # The test and lint toolchain moves together and never changes shipped behaviour.
      dev-toolchain:
        dependency-type: "development"
        patterns: ["@types/*", "@vscode/test-*", "mocha", "@biomejs/biome"]
    ignore:
      # @types/vscode is the engines.vscode floor (docs/ARCHITECTURE.md); raise both together, by hand.
      - dependency-name: "@types/vscode"

  # The store CLIs publish.yml runs (tools/publish). Before merging, check that
  # `tools/publish/node_modules/.bin/vsce publish --help` still lists --oidc and `ovsx publish --help`
  # --trusted-publishing: no CI job runs them.
  - package-ecosystem: "npm"
    directory: "/tools/publish"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "ci(deps)"
    groups:
      publish-tools:
        patterns: ["*"]

  # Actions in .github/workflows are pinned by commit SHA with a version comment; Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
