# The standalone repro of the webview first-load stall (repro/webview-first-load-stall/): in N fresh VS Code windows
# per OS × version, a webview panel is closed while its page loads and a second one of the same view type is opened
# (arm `cut`), or only the second one is opened (arm `control`); a page that sends nothing in 30 s stalled. Arms
# `cut-inline` (an inline ping before the big script), `cut-delay` (1 s between the close and the next open) and
# `cut-recreate` (a silent page's panel recreated after 10 s) tell the cause apart and measure the fixes; a page
# silent for 10 s is probed over the DevTools protocol (its log lines `probe {…}`). The summary job prints the stall
# rate per OS × version × arm.
#
# Actions are pinned by commit SHA with the version in a comment, as in ci.yml.
name: Repro webview first-load stall

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Fresh windows per arm, per OS and VS Code version
        default: "40"
      arms:
        description: Arms, comma-separated (cut, control, cut-inline, cut-delay, cut-recreate)
        default: cut,control,cut-inline,cut-delay,cut-recreate
  pull_request:
    paths:
      - repro/webview-first-load-stall/**
      - .github/workflows/repro-webview-stall.yml

permissions:
  contents: read

concurrency:
  group: repro-webview-stall-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  WINDOWS: ${{ inputs.windows || '40' }}
  ARMS: ${{ inputs.arms || 'cut,control,cut-inline,cut-delay,cut-recreate' }}

jobs:
  repro:
    name: Repro ${{ matrix.os }} ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: [stable, insiders]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Only for @vscode/test-electron: the repro extension itself has no dependencies.
      - run: npm ci
      - name: Run the repro
        env:
          VSCODE: ${{ matrix.vscode }}
          LABEL: ${{ runner.os }}-${{ matrix.vscode }}
        run: |
          set -euo pipefail
          cd repro/webview-first-load-stall
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a node run.mjs --version "${VSCODE}" --windows "${WINDOWS}" --arms "${ARMS}" --label "${LABEL}"
          else
            node run.mjs --version "${VSCODE}" --windows "${WINDOWS}" --arms "${ARMS}" --label "${LABEL}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repro-${{ runner.os }}-${{ matrix.vscode }}
          path: repro/webview-first-load-stall/results/
          if-no-files-found: warn

  summary:
    name: Stall rate per OS × VS Code × arm
    needs: repro
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-*
          path: results
      - name: Summary
        run: |
          set -euo pipefail
          node repro/webview-first-load-stall/summary.mjs results | tee -a "${GITHUB_STEP_SUMMARY}"
